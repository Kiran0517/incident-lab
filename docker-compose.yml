name: incident-lab

x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_METRICS_EXPORTER: none   # metrics come from Prometheus scraping /actuator/prometheus
  OTEL_LOGS_EXPORTER: none      # logs go to stdout as structured JSON

x-db-env: &db-env
  DB_URL: jdbc:postgresql://postgres:5432/shop
  DB_USER: shop
  DB_PASSWORD: shop

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 3s
      timeout: 3s
      retries: 20

  inventory-service:
    build: { context: ., args: { SERVICE: inventory-service } }
    environment:
      <<: [*otel-env, *db-env]
      OTEL_SERVICE_NAME: inventory-service
      DB_POOL_SIZE: "10"
    ports: ["8082:8082"]
    depends_on: { postgres: { condition: service_healthy } }

  payment-service:
    build: { context: ., args: { SERVICE: payment-service } }
    environment:
      <<: [*otel-env, *db-env]
      OTEL_SERVICE_NAME: payment-service
    ports: ["8083:8083"]
    depends_on: { postgres: { condition: service_healthy } }

  order-service:
    build: { context: ., args: { SERVICE: order-service } }
    environment:
      <<: [*otel-env, *db-env]
      OTEL_SERVICE_NAME: order-service
      INVENTORY_URL: http://inventory-service:8082
      PAYMENT_URL: http://toxiproxy:8666
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }
      inventory-service: { condition: service_started }
      payment-service: { condition: service_started }

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes: [./observability/toxiproxy.json:/config/toxiproxy.json:ro]
    ports: ["8474:8474"]
    depends_on: [payment-service]

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "50000"
    ports: ["16686:16686", "4317:4317", "4318:4318"]

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: [./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes: [./observability/grafana/provisioning:/etc/grafana/provisioning:ro]
    ports: ["3000:3000"]
    depends_on: [prometheus, jaeger]

volumes:
  pgdata:
